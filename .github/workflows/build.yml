name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Public OAuth client ids (repository variables); without them the app offers token sign-in.
      RABSHOOT_GITHUB_CLIENT_ID: ${{ vars.RABSHOOT_GITHUB_CLIENT_ID }}
      RABSHOOT_GITHUB_APP_SLUG: ${{ vars.RABSHOOT_GITHUB_APP_SLUG }}
      RABSHOOT_GITLAB_CLIENT_ID: ${{ vars.RABSHOOT_GITLAB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine
        run: python -m pip install -e "engine[dev]"

      - name: Test engine
        working-directory: engine
        env:
          RABSHOOT_SECRETS: file
        run: python -m pytest -q

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine sidecar
        run: python scripts/build_engine.py

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev build-essential patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install UI dependencies
        working-directory: app
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('RabShoot {0}', github.ref_name) || '' }}
          releaseDraft: false
          prerelease: false

      # Fixed names keep the README's ".../releases/latest/download/<name>" links working for every version.
      - name: Attach installers with fixed names
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stable
          bundle=app/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp "$(ls $bundle/deb/*.deb | head -1)" stable/RabShoot-linux-amd64.deb
            ls $bundle/appimage/*.AppImage >/dev/null 2>&1 && \
              cp "$(ls $bundle/appimage/*.AppImage | head -1)" stable/RabShoot-linux-x86_64.AppImage
          else
            cp "$(ls $bundle/nsis/*-setup.exe | head -1)" stable/RabShoot-windows-x64-setup.exe
          fi
          gh release upload "$GITHUB_REF_NAME" stable/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: rabshoot-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
